name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: testflight-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Memory/swap sampling from a prior run ruled out resource exhaustion
      # (vm.swapusage stayed at 0 the whole time; the only processes ever
      # showing up as memory consumers were macOS's own Spotlight indexer
      # (mds_stores/Spotlight), never ld/clang/xcodebuild/dsymutil). That
      # points at Spotlight indexing the freshly-downloaded huge binaries and
      # contending for disk I/O/file locks with the build - a well-known
      # GitHub Actions macOS CI gotcha, and it explains why the hang moved
      # between three different steps across runs: it's about when Spotlight
      # touches the contended files, not a bug in any one build step.
      - name: Disable Spotlight indexing on the work volume
        run: sudo mdutil -a -i off || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show disk and memory headroom
        run: |
          df -h /
          sysctl hw.memsize hw.ncpu

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /Applications/Godot.app
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos-v2

      - name: Install Godot editor + iOS export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          # Verify against Godot's official published checksums rather than
          # trusting the download blind - this is a supply-chain step in a
          # job that later signs and ships a real TestFlight build.
          curl -fsSL -o SHA512-SUMS.txt "$RELEASE_URL/SHA512-SUMS.txt"

          # $1 = filename as listed in SHA512-SUMS.txt, $2 = local filename
          # we actually saved it as (curl -o renames it).
          verify() {
            hash=$(grep " ${1}\$" SHA512-SUMS.txt | awk '{print $1}')
            echo "$hash  $2" | shasum -a 512 -c -
          }

          curl -fsSL -o godot.zip "$RELEASE_URL/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          verify "Godot_v${GODOT_VERSION}-stable_macos.universal.zip" godot.zip
          unzip -q godot.zip -d godot_bin
          sudo mv godot_bin/Godot.app /Applications/Godot.app

          curl -fsSL -o export_templates.tpz "$RELEASE_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          verify "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" export_templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          # Only ios.zip is needed for this workflow - the full tpz bundles
          # android/linux/macos/web templates too, multiple GB of disk this
          # runner doesn't need to spend.
          unzip -q export_templates.tpz "templates/ios.zip" -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/ios.zip \
            "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          rm -f export_templates.tpz
          rm -rf /tmp/godot_templates

      - name: Link godot binary
        run: sudo ln -sf /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Import project resources
        run: godot --headless --editor --quit-after 1

      - name: Export iOS Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/griss.xcodeproj

      - name: Locate generated Xcode project
        run: |
          set -euo pipefail
          XCODEPROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -n1)
          if [ -z "$XCODEPROJ" ]; then
            echo "::error::No .xcodeproj found under build/ios after Godot export" >&2
            find build/ios
            exit 1
          fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Found $XCODEPROJ with scheme $SCHEME"
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up SSH access to the match certificates repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/match_deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Show disk headroom before archive
        run: df -h /

      # Ruled out memory exhaustion (vm.swapusage stayed at 0 for the entire
      # hang) and Spotlight (disabling it in the previous PR made no
      # difference - it was just coincidental background noise, not the
      # cause). Not yet checked: CPU. This runner only has 3 vCPUs - a
      # CPU-bound linker under virtualization overhead would look identical
      # to a genuine hang in memory-only data. Track the actual build
      # processes directly by name (cpu%, mem%, and process state - 'D'
      # means blocked on I/O, 'R' with high cpu% means genuinely busy, 'S'
      # near-0% cpu for a long stretch means actually stuck) rather than
      # relying on top's mem-sorted top-5, which can miss a CPU-bound
      # process entirely if its memory footprint is unremarkable.
      - name: Start memory/swap/CPU sampler
        run: |
          (
            while true; do
              echo "=== $(date -u +%H:%M:%S) ==="
              vm_stat || true
              sysctl vm.swapusage || true
              echo "--- top 5 by CPU ---"
              top -l 1 -n 5 -o cpu -stats pid,command,cpu,mem 2>/dev/null | tail -8 || true
              echo "--- build-related processes (pid, %cpu, %mem, state, name) ---"
              ps -axo pid,pcpu,pmem,stat,comm 2>/dev/null | grep -iE "ld|xcodebuild|clang|swift-frontend|swift-build|codesign|dsymutil|appintent" | grep -v grep || echo "(none found)"
              echo
              sleep 10
            done
          ) > /tmp/memory-sampler.log 2>&1 &
          echo $! > /tmp/memory-sampler.pid

      - name: Build and upload to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane ios beta

      - name: Show memory/swap sampler output
        if: always()
        run: |
          kill "$(cat /tmp/memory-sampler.pid)" 2>/dev/null || true
          tail -300 /tmp/memory-sampler.log || true

      - name: Upload memory/swap sampler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-sampler-log
          path: /tmp/memory-sampler.log
          if-no-files-found: ignore
