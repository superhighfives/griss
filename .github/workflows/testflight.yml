name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: testflight-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show disk and memory headroom
        run: |
          df -h /
          sysctl hw.memsize hw.ncpu

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /Applications/Godot.app
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos-v2

      - name: Install Godot editor + iOS export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d godot_bin
          sudo mv godot_bin/Godot.app /Applications/Godot.app

          curl -fsSL -o export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          # Only ios.zip is needed for this workflow - the full tpz bundles
          # android/linux/macos/web templates too, multiple GB of disk this
          # runner doesn't need to spend.
          unzip -q export_templates.tpz "templates/ios.zip" -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/ios.zip \
            "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          rm -f export_templates.tpz
          rm -rf /tmp/godot_templates

      - name: Link godot binary
        run: sudo ln -sf /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Import project resources
        run: godot --headless --editor --quit-after 1

      - name: Export iOS Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/griss.xcodeproj

      - name: Locate generated Xcode project
        run: |
          set -euo pipefail
          XCODEPROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -n1)
          if [ -z "$XCODEPROJ" ]; then
            echo "::error::No .xcodeproj found under build/ios after Godot export" >&2
            find build/ios
            exit 1
          fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Found $XCODEPROJ with scheme $SCHEME"
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up SSH access to the match certificates repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/match_deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Show disk headroom before archive
        run: df -h /

      # Two of the last three runs hung ~20-45 minutes at the archive/link
      # step with no further log output, at three different points across
      # runs - looks like memory-pressure swap thrashing, but that's still a
      # guess. Sample real memory/swap state every 10s in the background so
      # a repeat gives actual evidence instead of another guess. Written to
      # disk, not stdout, so it survives even if this step gets killed by
      # the job timeout - the next step (if: always()) surfaces it either way.
      - name: Start memory/swap sampler
        run: |
          (
            while true; do
              echo "=== $(date -u +%H:%M:%S) ==="
              vm_stat || true
              sysctl vm.swapusage || true
              top -l 1 -n 5 -o mem -stats pid,command,mem 2>/dev/null | tail -8 || true
              echo
              sleep 10
            done
          ) > /tmp/memory-sampler.log 2>&1 &
          echo $! > /tmp/memory-sampler.pid

      - name: Build and upload to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane ios beta

      - name: Show memory/swap sampler output
        if: always()
        run: |
          kill "$(cat /tmp/memory-sampler.pid)" 2>/dev/null || true
          tail -300 /tmp/memory-sampler.log || true

      - name: Upload memory/swap sampler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-sampler-log
          path: /tmp/memory-sampler.log
          if-no-files-found: ignore
